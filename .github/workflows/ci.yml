name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trainer-contract:
    name: Pinned TRL CPU contract
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      ATLASOPS_REQUIRE_TRL_INTEGRATION: "1"
      ATLASOPS_REQUIRE_PINNED_CPU_STACK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" \
            trl==0.19.1 transformers==4.57.6 peft==0.17.1 \
            accelerate==1.14.0 datasets==4.8.5 \
            tokenizers==0.22.2 huggingface-hub==0.36.2
      - name: Test installed trainer without pretrained weights or training
        run: python -m pytest tests/test_grpo_observation_installed_trl.py -q

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser scripts
        run: |
          node --check static/console.js
          node --check static/live-incident.js

      - name: Test live incident projection
        run: node --test static/live-incident.test.js

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            agents bench config training scripts \
            app.py dashboard.py eval.py inference.py leaderboard.py

      - name: Check infrastructure shell syntax
        run: |
          bash -n infra/setup.sh infra/setup_impl.sh infra/teardown.sh infra/teardown_impl.sh \
            infra/local/install_metrics_server.sh

      - name: Ruff correctness checks
        run: python -m ruff check . --select E9,F63,F7,F821

      - name: Run full unit test suite
        run: python -m pytest tests/

      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
