name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-container:
    name: UI container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build source UI image
        run: docker build --tag atlasops-ui-ci .

      - name: Check network-isolated UI startup
        run: |
          docker run --detach --network none --name atlasops-ui-ci \
            --env ATLASOPS_AUTO_HF_INFERENCE=0 atlasops-ui-ci
          docker exec --interactive atlasops-ui-ci python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:7860"
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(base + "/health", timeout=1) as response:
                      assert response.status == 200
                  break
              except urllib.error.URLError:
                  time.sleep(0.2)
          else:
              raise RuntimeError("UI container readiness timed out")

          for route in (
              "/", "/static/console.js", "/static/console.css",
              "/static/vendor/lucide.min.js", "/ui/catalog", "/config",
          ):
              with urllib.request.urlopen(base + route, timeout=3) as response:
                  assert response.status == 200 and response.read(), route

          request = urllib.request.Request(
              base + "/webhook", data=b"{}",
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(request, timeout=3)
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, exc.code
          else:
              raise AssertionError("unconfigured webhook failed open")
          print("UI container startup and fail-closed webhook checks passed")
          PY

      - name: Remove test container
        if: always()
        run: |
          if docker container inspect atlasops-ui-ci > /dev/null 2>&1
          then
            docker stop atlasops-ui-ci
            docker container rm atlasops-ui-ci
          fi

  trainer-contract:
    name: Pinned TRL CPU contract
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
      ATLASOPS_REQUIRE_TRL_INTEGRATION: "1"
      ATLASOPS_REQUIRE_PINNED_CPU_STACK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest \
            trl==0.19.1 transformers==4.57.6 peft==0.17.1 \
            accelerate==1.14.0 datasets==4.8.5 \
            tokenizers==0.22.2 huggingface-hub==0.36.2
      - name: Test installed trainer and tiny controlled optimizer without pretrained weights
        run: python -m pytest tests/test_grpo_observation_installed_trl.py -q
      - name: Test fresh local reload with permanent socket guard
        run: python -m pytest tests/test_grpo_reload_installed.py -q
      - name: Test free-T4 attention, loss, and metrics on tiny CPU fixtures
        run: |
          python -m pytest tests/test_sft_chunked_loss.py \
            tests/test_sft_t4_attention.py tests/test_sft_supervised_trainer.py -q
      - name: Test matched Validation inference contract without pretrained weights
        run: |
          python -m pytest tests/test_base_sft_validation.py \
            tests/test_verify_base_sft_validation.py -q

  inference-runtime:
    name: G4 v3.8 locked inference runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up exact Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.11"
      - name: Install both immutable locks with hashes
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r requirements/sft-pilot-linux-py312.lock \
            -r requirements/g4-v38-inference-runtime-v1.lock
          python -m pip check
      - name: Qualify imports and bounded server startup without models
        run: python -B -m scripts.qualify_inference_runtime

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser scripts
        run: |
          node --check static/console.js
          node --check static/live-incident.js

      - name: Test live incident projection
        run: node --test static/live-incident.test.js

      - name: Set up presentation-only Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install presentation dependencies
        run: |
          python -m pip install fastapi uvicorn httpx
          npm ci --prefix frontend

      - name: Build and test React presentation
        working-directory: frontend
        run: |
          npm run build
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Preserve browser QA on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-browser-qa
          path: frontend/test-results

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            agents bench config training scripts \
            app.py dashboard.py eval.py inference.py leaderboard.py

      - name: Check infrastructure shell syntax
        run: |
          bash -n infra/setup.sh infra/setup_impl.sh infra/teardown.sh infra/teardown_impl.sh \
            infra/local/install_metrics_server.sh

      - name: Ruff correctness checks
        run: python -m ruff check . --select E9,F63,F7,F821

      - name: Run full unit test suite
        run: python -m pytest tests/

      - name: Build package
        if: matrix.python-version == '3.12'
        run: python -m build
