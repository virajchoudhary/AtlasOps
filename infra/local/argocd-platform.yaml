apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: atlasops-boutique
  namespace: argocd
spec:
  description: Owns only the pinned AtlasOps Online Boutique overlay.
  sourceRepos:
    - https://github.com/virajchoudhary/AtlasOps.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: atlasops-boutique
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlasops-coordinator-argocd-application
  namespace: argocd
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    resourceNames:
      - atlasops-boutique
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlasops-coordinator-argocd-application
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlasops-coordinator-argocd-application
subjects:
  - kind: ServiceAccount
    name: atlasops-coordinator
    namespace: default
