apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: atlasops-boutique
resources:
  - https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/98e60f5ee0b643cc00bceb71e6efb89617740432/release/kubernetes-manifests.yaml
patches:
  - target:
      version: v1
      kind: Service
      name: frontend-external
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
  - target:
      version: v1
      kind: Service
      name: frontend
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend
      spec:
        type: NodePort
        ports:
          - name: http
            port: 80
            targetPort: 8080
            nodePort: 30080
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: frontend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        replicas: 1
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 25%
            maxUnavailable: 25%
        template:
          spec:
            containers:
              - name: server
                imagePullPolicy: IfNotPresent
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: atlasops-otel-collector.monitoring.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: frontend
                startupProbe:
                  httpGet:
                    path: /_healthz
                    port: 8080
                    httpHeaders:
                      - name: Cookie
                        value: shop_session-id=x-startup-probe
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 18
                readinessProbe:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
                livenessProbe:
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkoutservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: checkoutservice
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: ENABLE_TRACING
                    value: "1"
                  - name: COLLECTOR_SERVICE_ADDR
                    value: atlasops-otel-collector.monitoring.svc.cluster.local:4317
                  - name: OTEL_SERVICE_NAME
                    value: checkoutservice
                startupProbe:
                  grpc:
                    port: 5050
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 18
                readinessProbe:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
                livenessProbe:
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 6
