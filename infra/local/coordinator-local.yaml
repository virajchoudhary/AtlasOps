# AtlasOps integrated runtime — local Kind deployment
# Render the source SHA and explicit operator/model settings before applying.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlasops-coordinator
  namespace: default
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlasops-coordinator-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlasops-coordinator-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlasops-coordinator-readonly
subjects:
  - kind: ServiceAccount
    name: atlasops-coordinator
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlasops-coordinator-chaos
  namespace: chaos-mesh
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources:
      - podchaos
      - stresschaos
      - networkchaos
      - dnschaos
      - iochaos
      - timechaos
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlasops-coordinator-chaos
  namespace: chaos-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlasops-coordinator-chaos
subjects:
  - kind: ServiceAccount
    name: atlasops-coordinator
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlasops-coordinator-remediation
  namespace: atlasops-boutique
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames:
      - adservice
      - cartservice
      - checkoutservice
      - currencyservice
      - emailservice
      - frontend
      - loadgenerator
      - paymentservice
      - productcatalogservice
      - recommendationservice
      - redis-cart
      - shippingservice
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlasops-coordinator-remediation
  namespace: atlasops-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlasops-coordinator-remediation
subjects:
  - kind: ServiceAccount
    name: atlasops-coordinator
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlasops-coordinator-chaos-cleanup
  namespace: chaos-mesh
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["podchaos", "stresschaos", "networkchaos", "dnschaos", "iochaos", "timechaos"]
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlasops-coordinator-chaos-cleanup
  namespace: chaos-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlasops-coordinator-chaos-cleanup
subjects:
  - kind: ServiceAccount
    name: atlasops-coordinator
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: atlasops-coordinator-config
  namespace: default
data:
  BACKEND: "vllm"
  VLLM_BASE: "__ATLASOPS_VLLM_BASE__"
  AGENT_MODEL: "__ATLASOPS_AGENT_MODEL__"
  ATLASOPS_AUTO_HF_INFERENCE: "0"
  ATLASOPS_USE_HF_INFERENCE: "0"
  ATLASOPS_OPERATIONAL_MODE: "1"
  ATLASOPS_OPERATOR_ID: "__ATLASOPS_OPERATOR_ID__"
  ATLASOPS_WORKLOAD_NAMESPACE: "atlasops-boutique"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://atlasops-otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "atlasops-coordinator"
  ATLASOPS_ARGOCD_APP: "atlasops-boutique"
  ATLASOPS_ARGOCD_NAMESPACE: "argocd"
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
  ALERTMANAGER_URL: "http://prometheus-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093"
  JAEGER_URL: "http://jaeger.jaeger.svc.cluster.local:16686"
  ARGOCD_URL: "http://argocd-server.argocd.svc.cluster.local:80"
  ARGOCD_VERIFY_TLS: "false"
  ATLASOPS_AUDIT_LOG: "/var/lib/atlasops/audit/audit_log.jsonl"
  ATLASOPS_RUNTIME_DATA_DIR: "/var/lib/atlasops/comms"
  POSTMORTEM_DIR: "/var/lib/atlasops/postmortems"
  TRAJECTORIES_DIR: "/var/lib/atlasops/trajectories"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlasops-runtime-data
  namespace: default
  labels:
    app.kubernetes.io/name: atlasops-coordinator
    app.kubernetes.io/part-of: atlasops
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlasops-coordinator
  namespace: default
  labels:
    app.kubernetes.io/name: atlasops-coordinator
    app.kubernetes.io/part-of: atlasops
    app.kubernetes.io/version: "__ATLASOPS_SOURCE_SHA__"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlasops-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlasops-coordinator
        app.kubernetes.io/part-of: atlasops
        app.kubernetes.io/version: "__ATLASOPS_SOURCE_SHA__"
    spec:
      serviceAccountName: atlasops-coordinator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: atlasops:__ATLASOPS_SOURCE_SHA__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          envFrom:
            - configMapRef:
                name: atlasops-coordinator-config
          env:
            - name: ATLASOPS_AUDIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlasops-coordinator-secrets
                  key: atlasops-audit-secret
            - name: ALERTMANAGER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlasops-coordinator-secrets
                  key: alertmanager-webhook-secret
            - name: ATLASOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlasops-coordinator-secrets
                  key: atlasops-api-key
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: atlasops-coordinator-secrets
                  key: llm-api-key
                  optional: true
            - name: ARGOCD_USER
              valueFrom:
                secretKeyRef:
                  name: atlasops-coordinator-secrets
                  key: argocd-user
            - name: ARGOCD_PASS
              valueFrom:
                secretKeyRef:
                  name: atlasops-coordinator-secrets
                  key: argocd-pass
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-data
              mountPath: /var/lib/atlasops
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime-data
          persistentVolumeClaim:
            claimName: atlasops-runtime-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atlasops-coordinator-svc
  namespace: default
  labels:
    app.kubernetes.io/name: atlasops-coordinator
    app.kubernetes.io/part-of: atlasops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlasops-coordinator
  ports:
    - name: http
      port: 9099
      targetPort: http
      protocol: TCP
