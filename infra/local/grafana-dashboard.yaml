apiVersion: v1
kind: ConfigMap
metadata:
  name: atlasops-boutique-dashboard
  namespace: monitoring
  labels:
    app.kubernetes.io/name: atlasops-boutique-dashboard
    app.kubernetes.io/part-of: atlasops
    grafana_dashboard: "1"
data:
  atlasops-boutique.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Server-span counts from the enabled Boutique tracing instrumentation.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service_name) (rate(atlasops_boutique_calls_total{span_kind=\"SPAN_KIND_SERVER\"}[5m]))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Traced server spans per second",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Server spans whose OpenTelemetry status is Error.",
          "fieldConfig": {
            "defaults": {
              "unit": "errps",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (service_name) (rate(atlasops_boutique_calls_total{span_kind=\"SPAN_KIND_SERVER\",status_code=\"STATUS_CODE_ERROR\"}[5m]))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Errored server spans per second",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "The 95th percentile of durations recorded from server spans, in milliseconds.",
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le, service_name) (rate(atlasops_boutique_duration_milliseconds_bucket{span_kind=\"SPAN_KIND_SERVER\"}[5m])))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ],
          "title": "Server span duration p95",
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "atlasops",
        "non-empirical-software-fixture",
        "tracing"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "AtlasOps Boutique trace observations",
      "uid": "atlasops-boutique",
      "version": 1,
      "weekStart": ""
    }
