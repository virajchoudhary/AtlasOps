# AtlasOps Local Kind Cluster Configuration
# Pipeline v1.1 Free-First — zero external-service cost
# Cluster name: atlasops-local
# Context: kind-atlasops-local
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Online Boutique frontend only. Admin services use loopback port-forwards.
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
