# Jaeger chart 4.x runs the Jaeger v2 distribution.
# Its in-memory trace store is bounded and is lost when the Pod is replaced.
jaeger:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  podSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

userconfig:
  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: primary
        traces_archive: primary
    jaeger_storage:
      backends:
        primary:
          memory:
            max_traces: 5000
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
  processors:
    batch: {}
  exporters:
    jaeger_storage_exporter:
      trace_storage: primary
  service:
    extensions:
      - healthcheckv2
      - jaeger_query
      - jaeger_storage
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - batch
        exporters:
          - jaeger_storage_exporter

# The chart's storage.type applies only to its disabled Elasticsearch/Cassandra
# maintenance components. Jaeger v2 storage is defined in userconfig above.
storage:
  type: elasticsearch
  cassandra:
    usePassword: false
