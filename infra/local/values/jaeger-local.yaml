# AtlasOps Local Jaeger — minimal Kind profile
# Pipeline v1.1 Free-First
#
# Uses all-in-one strategy with in-memory storage
# Lightest defensible configuration for Stage 3 gate

provisionDataStore:
  cassandra: false
  elasticsearch: false

allInOne:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv:
    - name: MEMORY_MAX_TRACES
      value: "5000"

storage:
  type: memory

agent:
  enabled: false

collector:
  enabled: false

query:
  enabled: false
