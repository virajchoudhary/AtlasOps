# AtlasOps Local Prometheus Stack — low-resource Kind profile
# Pipeline v1.1 Free-First
#

grafana:
  enabled: true
  admin:
    existingSecret: atlasops-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: ClusterIP
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec: {}
    replicas: 1
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    retention: 6h
    storage: {}
    replicas: 1
    secrets:
      - atlasops-alertmanager-webhook
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discard
      group_by: [alertname, namespace, deployment]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - receiver: atlasops-coordinator
          matchers:
            - atlasops_route="coordinator"
    receivers:
      - name: discard
      - name: atlasops-coordinator
        webhook_configs:
          - url: http://atlasops-coordinator-svc.default.svc.cluster.local:9099/webhook
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/atlasops-alertmanager-webhook/alertmanager-webhook-secret

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheusOperator:
  admissionWebhooks:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

nodeExporter:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

coreDns:
  enabled: false
