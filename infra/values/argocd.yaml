server:
  service:
    type: ClusterIP  # use kubectl port-forward for operator access

# Keep secure defaults in versioned config. For demo-only environments,
# pass --set server.extraArgs[0]=--insecure at deploy time instead.

repoServer:
  replicaCount: 1

applicationSet:
  enabled: true

notifications:
  enabled: false  # we use Alertmanager + Slack instead

# Reduce resource requests for the development cluster (1-3 e2-standard-4 nodes)
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
