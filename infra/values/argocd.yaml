server:
  service:
    type: ClusterIP  # Private in-cluster access only; use kubectl port-forward for operator access
  extraArgs:
    - --insecure  # Development cluster exception: serve plain HTTP on private in-cluster ClusterIP (not production security)

configs:
  params:
    server.insecure: true
  cm:
    accounts.atlasops: login
  rbac:
    policy.csv: |
      p, role:atlasops-readonly, applications, get, */*, allow
      p, role:atlasops-readonly, applications, list, */*, allow
      g, atlasops, role:atlasops-readonly

repoServer:
  replicaCount: 1

applicationSet:
  enabled: true

notifications:
  enabled: false  # we use Alertmanager + Slack instead

# Reduce resource requests for the development cluster (1-3 e2-standard-4 nodes)
controller:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
