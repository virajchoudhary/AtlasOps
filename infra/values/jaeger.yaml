# AtlasOps Jaeger deployment configuration for G3 observability readiness.
# Chart: jaegertracing/jaeger (pinned: 4.12.0)
#
# Provides private, in-cluster query and collector services for distributed tracing.
# Query API endpoint: http://jaeger.jaeger.svc.cluster.local:16686
#
# Note: Installing this chart establishes backend reachability for G3.
# Real trace ingestion from Online Boutique remains an independent follow-up.

jaeger:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
