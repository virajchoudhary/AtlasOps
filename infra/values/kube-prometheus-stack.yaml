grafana:
  enabled: true
  service:
    type: ClusterIP  # use kubectl port-forward for operator access
  # Do not commit static admin passwords. Set via one of:
  # - grafana.admin.existingSecret
  # - helm --set-file for secure CI/CD injection
  # Grafana chart will generate a random admin password if none is provided.
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    # Kubernetes Secrets are namespace-scoped. The operator must create this
    # webhook-only Secret in monitoring; its value must match the coordinator
    # Secret in default. Setup validates key presence without reading values.
    secrets:
      - atlasops-alertmanager-webhook
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: discard
      group_by: [alertname, namespace, deployment]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: atlasops-coordinator
          matchers:
            - atlasops_route="coordinator"
    receivers:
      - name: discard
      - name: atlasops-coordinator
        webhook_configs:
          - url: http://atlasops-coordinator-svc.default.svc.cluster.local:9099/webhook
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/atlasops-alertmanager-webhook/alertmanager-webhook-secret

# Disable components that require hostPID/hostPath or managed control-plane access.
# nodeExporter needs hostPath; kube{Proxy,Etcd,ControllerManager,Scheduler} target
# GKE-managed endpoints that are inaccessible on Standard clusters.
nodeExporter:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

coreDns:
  enabled: false

# Disable node affinity with disallowed label keys
prometheusOperator:
  enabled: true
  affinity: {}
  tolerations: []

kubeStateMetrics:
  enabled: true
