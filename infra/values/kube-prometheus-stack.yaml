grafana:
  enabled: true
  service:
    type: ClusterIP  # use kubectl port-forward for operator access
  # Do not commit static admin passwords. Set via one of:
  # - grafana.admin.existingSecret
  # - helm --set-file for secure CI/CD injection
  # Grafana chart will generate a random admin password if none is provided.
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"

prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
alertmanager:
  # Stage 1D-B will add a coordinator route only after the matching lowercase
  # Deployment and Service exist. The chart's valid base config is used now.
  service:
    type: ClusterIP

# Disable components that require hostPID/hostPath or managed control-plane access.
# nodeExporter needs hostPath; kube{Proxy,Etcd,ControllerManager,Scheduler} target
# GKE-managed endpoints that are inaccessible on Standard clusters.
nodeExporter:
  enabled: false

kubeProxy:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

coreDns:
  enabled: false

# Disable node affinity with disallowed label keys
prometheusOperator:
  enabled: true
  affinity: {}
  tolerations: []

kubeStateMetrics:
  enabled: true
