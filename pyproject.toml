[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "atlasops"
version = "1.0.0"
description = "AtlasOps governed multi-agent SRE research and read-only evidence demo"
requires-python = ">=3.11"
dependencies = [
    # Agent runtime
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "fastapi",
    "uvicorn",
    # GCP clients
    "google-cloud-monitoring>=2.20.0",
    "google-cloud-logging>=3.10.0",
    "google-auth>=2.29.0",
    # Kubernetes
    "kubernetes>=30.1.0",
    # Observability clients
    "requests>=2.32.0",
    "urllib3",
    # Utils
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
demo = [
    "fastapi",
    "uvicorn",
]
train = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "trl>=0.9.0",
    "peft>=0.11.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "vllm>=0.5.0",
    "bitsandbytes>=0.43.0",
]
dev = [
    "gradio>=4.36.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "bcrypt>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "bench", "config", "training"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/OVERNIGHT_STATE.md",
    "/artifacts/local-preflight",
    "/artifacts/overnight_diffs",
    "**/*.bak*",
    "**/.env*",
    "**/credentials.json",
    "**/application_default_credentials.json",
    "**/*service-account*.json",
    "**/*service_account*.json",
    "**/gcp-credentials*.json",
    "**/gcloud-credentials*.json",
    "**/*.secret",
    "**/*.secrets",
    "**/*.key",
    "**/*.token",
    "**/*.pem",
    "**/*.kubeconfig",
    "**/kubeconfig",
    "/frontend/node_modules",
    "/frontend/dist",
    "/frontend/test-results",
    "/frontend/playwright-report",
]

[tool.ruff]
line-length = 100
target-version = "py311"
