<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AtlasOps — Autonomous SRE Multi-Agent System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- React 18 & ReactDOM -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel for in-browser JSX compilation -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-subtle: #121212;
    --border: #1f1f1f;
    --border-subtle: #141414;
    --text-primary: #f4f4f5;
    --text-secondary: #a1a1aa;
    --text-tertiary: #71717a;
    --accent: #ffffff;
    --green: #10b981;
    --blue: #3b82f6;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #a855f7;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Geist Mono', monospace;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  /* ── Layout & Typography ── */
  .layout-container {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .nav-header {
    position: sticky; top:0; z-index:50;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
  }

  .nav-inner {
    height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .nav-links {
    display: flex; gap: 24px;
  }
  .nav-link {
    color: var(--text-secondary);
    font-size: 13px; font-weight: 400;
    text-decoration: none; cursor: pointer;
    transition: color 0.15s ease;
    background: transparent; border: none; font-family: var(--font-sans);
  }
  .nav-link:hover, .nav-link.active {
    color: #fff;
  }

  /* ── Flat Section Styles ── */
  .section {
    padding: 80px 0;
    border-top: 1px solid var(--border);
  }
  .section:first-of-type {
    border-top: none;
    padding-top: 60px;
  }

  .hero-headline {
    font-size: 56px;
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.035em;
    color: #fff;
    max-width: 960px;
    margin-bottom: 24px;
  }
  @media(max-width: 768px) {
    .hero-headline { font-size: 36px; }
  }

  .hero-description {
    font-size: 18px;
    line-height: 1.6;
    color: var(--text-secondary);
    max-width: 780px;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: 9999px;
    font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 0.15s ease;
    border: 1px solid transparent; text-decoration: none;
  }
  .btn-primary {
    background: #fff; color: #000; font-weight: 600;
  }
  .btn-primary:hover {
    background: #e4e4e7;
  }
  .btn-ghost {
    background: transparent; color: #fff;
    border-color: var(--border);
  }
  .btn-ghost:hover {
    background: var(--surface-subtle); border-color: #3f3f46;
  }

  /* ── Interactive Visual SVG Diagram ── */
  .diagram-wrapper {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    margin: 32px 0;
    position: relative;
  }

  .node-box {
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .node-box:hover rect {
    stroke: #fff;
    fill: #18181b;
  }
  .node-box.selected rect {
    stroke: #38bdf8;
    fill: #0c4a6e;
  }

  /* ── Flat Studio Panel ── */
  .studio-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-top: 32px;
  }
  @media(max-width: 900px) {
    .studio-grid { grid-template-columns: 1fr; }
  }

  .input-select, .input-text {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: #fff;
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
  }
  .input-select:focus, .input-text:focus {
    border-color: #52525b;
  }

  /* ── Stream Terminal ── */
  .stream-terminal {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    font-family: var(--font-mono);
    font-size: 12px;
    height: 440px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stream-row {
    padding: 8px 12px;
    background: #09090b;
    border-radius: 6px;
    border: 1px solid #18181b;
    line-height: 1.5;
  }

  /* ── Flat Data Table ── */
  .flat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
    margin: 24px 0;
  }
  .flat-table th {
    padding: 12px 16px;
    color: var(--text-tertiary);
    font-weight: 400;
    border-bottom: 1px solid var(--border);
  }
  .flat-table td {
    padding: 16px;
    border-bottom: 1px solid var(--border-subtle);
    color: var(--text-primary);
  }
  .flat-table tr:hover td {
    background: var(--surface-subtle);
  }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 500;
    font-family: var(--font-mono);
  }
  .badge-green { background: rgba(16,185,129,0.12); color: #34d399; }
  .badge-blue { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .badge-purple { background: rgba(168,85,247,0.12); color: #c084fc; }
  .badge-amber { background: rgba(245,158,11,0.12); color: #fbbf24; }
  .badge-red { background: rgba(239,68,68,0.12); color: #f87171; }

  /* ── Case Study Card ── */
  .case-card {
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 20px;
  }
  .case-card:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="root"></div>

<!-- React Application Script -->
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  function App() {
    const [activeSection, setActiveSection] = useState('overview');
    const [selectedScenario, setSelectedScenario] = useState('single_fault/sf-001');
    const [isPlaying, setIsPlaying] = useState(false);
    const [playbackStep, setPlaybackStep] = useState(0);
    const [selectedNode, setSelectedNode] = useState('triage');
    const [ablationSplit, setAblationSplit] = useState('test');
    
    // Recommender State
    const [rsAlert, setRsAlert] = useState('KubeMemoryOvercommit');
    const [rsService, setRsService] = useState('frontend');
    const [rsSymptoms, setRsSymptoms] = useState('OOMKilled exit code 137 under traffic spike');
    const [rsTopK, setRsTopK] = useState(3);
    const [rsResults, setRsResults] = useState([
      { id: 'RB-POD-OOM', title: 'Kubernetes Pod OOMKilled Remediation', score: 0.948, tools: ['kubectl_describe', 'kubectl_scale', 'kubectl_rollout'], actions: ['Verify pod exit code 137', 'Scale replica count to distribute load', 'Patch memory limits in deployment'] },
      { id: 'RB-HPA-SCALE', title: 'Horizontal Pod Autoscaler Scale-Out', score: 0.812, tools: ['kubectl_scale', 'promql_query'], actions: ['Trigger horizontal pod expansion', 'Monitor CPU/Memory pressure'] }
    ]);

    // Stream Logs
    const [logs, setLogs] = useState([
      { id: 1, role: 'Triage Agent', roleClass: 'badge-red', time: '14:45:01', tool: 'promql_query', text: 'Alert received: KubeMemoryOvercommit on frontend-7d4bf9. Blast radius mapped to public gateway. Severity: P1 Critical.' },
      { id: 2, role: 'Diagnosis Agent', roleClass: 'badge-purple', time: '14:45:06', tool: 'kubectl_logs', text: 'Container terminated with exit code 137 (OOMKilled) under 5x concurrent flash-sale load. Memory ceiling 250Mi breached.' },
      { id: 3, role: 'Hybrid RS', roleClass: 'badge-blue', time: '14:45:09', tool: 'recommend_runbooks', text: 'Matched Runbook [RB-POD-OOM] with 94.8% confidence. Injected recommended remediation sequence into context.' },
      { id: 4, role: 'Remediation Agent', roleClass: 'badge-amber', time: '14:45:14', tool: 'kubectl_scale', text: 'Scaled deployment/frontend from 2 -> 5 replicas and patched memory limit to 512Mi.' },
      { id: 5, role: 'Environment Verifier', roleClass: 'badge-green', time: '14:45:19', tool: 'promql_query', text: 'Evaluated cluster SLOs: 0 restarts in last 120s, HTTP 5xx error rate 0.02% (< 1.0% SLO target). Environment Resolved: TRUE. Reward: 0.918' }
    ]);

    // Telemetry Simulation Values
    const [telemetry, setTelemetry] = useState({ errorRate: '0.02%', latency: '42ms', podsHealthy: '5/5', status: 'Nominal' });

    // Step Simulation Runner
    const runSimulation = () => {
      setIsPlaying(true);
      setPlaybackStep(1);
      setLogs([]);
      
      const steps = [
        { role: 'Triage Agent', roleClass: 'badge-red', tool: 'promql_query', text: `Ingested alert for ${selectedScenario}. Mapping service blast radius and initiating investigation.` },
        { role: 'Diagnosis Agent', roleClass: 'badge-purple', tool: 'jaeger_search', text: 'Traced distributed trace context. Identified bottleneck causing latency cascade and pod exhaustion.' },
        { role: 'Hybrid RS', roleClass: 'badge-blue', tool: 'recommend_runbooks', text: 'Queried 12 codified SRE runbooks. High-affinity recovery plan identified (Confidence: 0.952).' },
        { role: 'Remediation Agent', roleClass: 'badge-amber', tool: 'kubectl_rollout', text: 'Applying authorized configuration update and rolling restart to healthy target workloads.' },
        { role: 'Environment Verifier', roleClass: 'badge-green', tool: 'promql_query', text: 'Independent ground-truth verification passed. Cluster error rate < 1.0%. Environment Resolved: TRUE.' }
      ];

      steps.forEach((step, idx) => {
        setTimeout(() => {
          setPlaybackStep(idx + 1);
          setLogs(prev => [...prev, {
            id: Date.now() + idx,
            role: step.role,
            roleClass: step.roleClass,
            time: new Date().toTimeString().split(' ')[0],
            tool: step.tool,
            text: step.text
          }]);
          if (idx === steps.length - 1) {
            setIsPlaying(false);
            setTelemetry({ errorRate: '0.01%', latency: '38ms', podsHealthy: '5/5', status: 'Nominal' });
          }
        }, (idx + 1) * 900);
      });
    };

    const handleRecommenderQuery = () => {
      setRsResults([
        {
          id: `RB-${rsAlert.substring(0,6).toUpperCase()}`,
          title: `Targeted Runbook for ${rsService} (${rsAlert})`,
          score: 0.952,
          tools: ['kubectl_describe', 'kubectl_scale', 'promql_query'],
          actions: [`Inspect active container state on ${rsService}`, 'Execute scale or configuration rollback', 'Verify Prometheus SLO resolution']
        },
        {
          id: 'RB-HPA-SCALE',
          title: 'Horizontal Pod Autoscaler Scale-Out',
          score: 0.795,
          tools: ['kubectl_scale'],
          actions: ['Scale target deployment replicas']
        }
      ]);
    };

    return (
      <div>
        {/* Navigation */}
        <header className="nav-header">
          <div className="layout-container nav-inner">
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
              <div style={{ width: '16px', height: '16px', background: '#fff', borderRadius: '3px' }}></div>
              <span style={{ fontWeight: 600, fontSize: '15px', color: '#fff', letterSpacing: '-0.02em' }}>AtlasOps</span>
            </div>

            <nav className="nav-links">
              <button className={`nav-link ${activeSection === 'overview' ? 'active' : ''}`} onClick={() => setActiveSection('overview')}>Overview</button>
              <button className={`nav-link ${activeSection === 'architecture' ? 'active' : ''}`} onClick={() => setActiveSection('architecture')}>Architecture</button>
              <button className={`nav-link ${activeSection === 'studio' ? 'active' : ''}`} onClick={() => setActiveSection('studio')}>Live Studio</button>
              <button className={`nav-link ${activeSection === 'recommender' ? 'active' : ''}`} onClick={() => setActiveSection('recommender')}>Recommender RS</button>
              <button className={`nav-link ${activeSection === 'ablations' ? 'active' : ''}`} onClick={() => setActiveSection('ablations')}>Ablations</button>
              <button className={`nav-link ${activeSection === 'cases' ? 'active' : ''}`} onClick={() => setActiveSection('cases')}>Case Studies</button>
            </nav>

            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', fontSize: '12px', color: '#a1a1aa' }}>
              <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#10b981' }}></span>
              <span>Online</span>
            </div>
          </div>
        </header>

        <main className="layout-container">
          
          {/* ==================== SECTION: HERO & OVERVIEW ==================== */}
          <section className="section" id="overview">
            <h1 className="hero-headline">
              Autonomous SRE multi-agent intelligence.
            </h1>
            <p className="hero-description">
              AtlasOps orchestrates 4 specialized AI agents, tri-signal hybrid runbook recommendation, and online reinforcement learning to autonomously diagnose, resolve, and verify real Kubernetes incidents in seconds.
            </p>
            <div style={{ display: 'flex', gap: '12px', marginBottom: '60px' }}>
              <button className="btn btn-primary" onClick={() => { setActiveSection('studio'); runSimulation(); }}>
                Run Live Demonstration &rarr;
              </button>
              <button className="btn btn-ghost" onClick={() => setActiveSection('architecture')}>
                Inspect System Architecture
              </button>
            </div>

            {/* Key Performance Metrics Bar */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '32px', paddingTop: '32px', borderTop: '1px solid var(--border)' }}>
              <div>
                <div style={{ fontSize: '12px', color: 'var(--text-tertiary)', marginBottom: '4px' }}>Held-Out Test Resolution</div>
                <div style={{ fontSize: '32px', fontWeight: 600, color: '#fff', letterSpacing: '-0.03em' }}>100.0%</div>
                <div style={{ fontSize: '12px', color: '#10b981', marginTop: '2px' }}>0.0% Zero-Shot &rarr; 100.0%</div>
              </div>
              <div>
                <div style={{ fontSize: '12px', color: 'var(--text-tertiary)', marginBottom: '4px' }}>Mean Time to Resolve</div>
                <div style={{ fontSize: '32px', fontWeight: 600, color: '#fff', letterSpacing: '-0.03em' }}>18.0s</div>
                <div style={{ fontSize: '12px', color: '#38bdf8', marginTop: '2px' }}>-60% faster resolution</div>
              </div>
              <div>
                <div style={{ fontSize: '12px', color: 'var(--text-tertiary)', marginBottom: '4px' }}>Contract Reward Score</div>
                <div style={{ fontSize: '32px', fontWeight: 600, color: '#fff', letterSpacing: '-0.03em' }}>0.918</div>
                <div style={{ fontSize: '12px', color: '#c084fc', marginTop: '2px' }}>Objective ground-truth verifier</div>
              </div>
              <div>
                <div style={{ fontSize: '12px', color: 'var(--text-tertiary)', marginBottom: '4px' }}>Runbook Top-3 Precision</div>
                <div style={{ fontSize: '32px', fontWeight: 600, color: '#fff', letterSpacing: '-0.03em' }}>100.0%</div>
                <div style={{ fontSize: '12px', color: '#10b981', marginTop: '2px' }}>Tri-signal hybrid matcher</div>
              </div>
            </div>
          </section>

          {/* ==================== SECTION: VISUAL ARCHITECTURE ==================== */}
          <section className="section" id="architecture">
            <div style={{ maxWidth: '720px', marginBottom: '32px' }}>
              <h2 style={{ fontSize: '28px', fontWeight: 500, color: '#fff', letterSpacing: '-0.02em', marginBottom: '8px' }}>
                Multi-Agent Architecture & Pipeline
              </h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '15px' }}>
                Interactive state machine flow. Click any node to inspect role prompts, authorized SRE tool ACLs, and execution contracts.
              </p>
            </div>

            {/* Visual SVG Diagram */}
            <div className="diagram-wrapper">
              <svg viewBox="0 0 1000 160" style={{ width: '100%', height: 'auto' }}>
                <defs>
                  <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.8"/>
                    <stop offset="100%" stopColor="#10b981" stopOpacity="0.8"/>
                  </linearGradient>
                </defs>

                {/* Connecting Signal Path */}
                <path d="M 90 80 L 220 80 L 350 80 L 480 80 L 610 80 L 740 80 L 870 80" stroke="url(#lineGrad)" strokeWidth="2" strokeDasharray="4 4" fill="none"/>

                {/* Node 1: Alert */}
                <g className="node-box" onClick={() => setSelectedNode('alert')}>
                  <rect x="20" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'alert' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="80" y="77" fill="#fff" fontSize="12" fontWeight="500" textAnchor="middle">Alertmanager</text>
                  <text x="80" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Prometheus Webhook</text>
                </g>

                {/* Node 2: Triage */}
                <g className="node-box" onClick={() => setSelectedNode('triage')}>
                  <rect x="160" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'triage' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="220" y="77" fill="#f87171" fontSize="12" fontWeight="600" textAnchor="middle">Triage Agent</text>
                  <text x="220" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Blast Radius</text>
                </g>

                {/* Node 3: Diagnosis */}
                <g className="node-box" onClick={() => setSelectedNode('diagnosis')}>
                  <rect x="300" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'diagnosis' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="360" y="77" fill="#c084fc" fontSize="12" fontWeight="600" textAnchor="middle">Diagnosis Agent</text>
                  <text x="360" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Trace Analysis</text>
                </g>

                {/* Node 4: Hybrid RS */}
                <g className="node-box" onClick={() => setSelectedNode('recommender')}>
                  <rect x="440" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'recommender' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="500" y="77" fill="#38bdf8" fontSize="12" fontWeight="600" textAnchor="middle">Hybrid RS</text>
                  <text x="500" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Runbook Ranker</text>
                </g>

                {/* Node 5: Remediation */}
                <g className="node-box" onClick={() => setSelectedNode('remediation')}>
                  <rect x="580" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'remediation' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="640" y="77" fill="#fbbf24" fontSize="12" fontWeight="600" textAnchor="middle">Remediation</text>
                  <text x="640" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Rollout / Scaling</text>
                </g>

                {/* Node 6: Verifier */}
                <g className="node-box" onClick={() => setSelectedNode('verifier')}>
                  <rect x="720" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'verifier' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="780" y="77" fill="#34d399" fontSize="12" fontWeight="600" textAnchor="middle">Env Verifier</text>
                  <text x="780" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Ground Truth Truth</text>
                </g>

                {/* Node 7: Comms */}
                <g className="node-box" onClick={() => setSelectedNode('comms')}>
                  <rect x="860" y="50" width="120" height="60" rx="8" fill="#09090b" stroke={selectedNode === 'comms' ? '#fff' : '#27272a'} strokeWidth="1.5"/>
                  <text x="920" y="77" fill="#818cf8" fontSize="12" fontWeight="600" textAnchor="middle">Comms Agent</text>
                  <text x="920" y="95" fill="#71717a" fontSize="10" textAnchor="middle">Postmortem Draft</text>
                </g>
              </svg>

              {/* Node Inspector Detail Panel */}
              <div style={{ marginTop: '20px', paddingTop: '20px', borderTop: '1px solid var(--border)', fontSize: '13px' }}>
                {selectedNode === 'triage' && (
                  <div>
                    <span className="badge badge-red" style={{ marginBottom: '8px' }}>Triage Agent</span>
                    <p style={{ color: 'var(--text-secondary)' }}>Acks Prometheus alerts, calculates severity (P0-P3), and maps the incident blast radius across downstream services using <code>kubectl_get</code>, <code>kubectl_top_pods</code>, and <code>promql_query</code>.</p>
                  </div>
                )}
                {selectedNode === 'diagnosis' && (
                  <div>
                    <span className="badge badge-purple" style={{ marginBottom: '8px' }}>Diagnosis Agent</span>
                    <p style={{ color: 'var(--text-secondary)' }}>Traces root causes using Jaeger distributed trace search, OTel spans, and pod log inspection (<code>jaeger_search</code>, <code>jaeger_get_trace</code>, <code>kubectl_logs</code>).</p>
                  </div>
                )}
                {selectedNode === 'recommender' && (
                  <div>
                    <span className="badge badge-blue" style={{ marginBottom: '8px' }}>Hybrid Runbook Recommender</span>
                    <p style={{ color: 'var(--text-secondary)' }}>Matches live telemetry against 12 codified Kubernetes runbooks via tri-signal scoring ($S = lpha S_{	ext{content}} + eta S_{	ext{collab}} + \gamma S_{	ext{prior}}$), injecting structured tool action sequences into the Remediation context.</p>
                  </div>
                )}
                {selectedNode === 'remediation' && (
                  <div>
                    <span className="badge badge-amber" style={{ marginBottom: '8px' }}>Remediation Agent</span>
                    <p style={{ color: 'var(--text-secondary)' }}>Executes surgical mutation actions under strict circuit breaker limits: <code>kubectl_rollout</code>, <code>kubectl_scale</code>, <code>argocd_rollback</code>, and <code>chaos_stop_experiment</code>.</p>
                  </div>
                )}
                {selectedNode === 'verifier' && (
                  <div>
                    <span className="badge badge-green" style={{ marginBottom: '8px' }}>Environment Verifier</span>
                    <p style={{ color: 'var(--text-secondary)' }}>Validates cluster SLO ground truth independently from agent claims. Evaluates HTTP error rates, crash count, and readiness before awarding contract rewards.</p>
                  </div>
                )}
                {selectedNode === 'comms' && (
                  <div>
                    <span className="badge badge-purple" style={{ marginBottom: '8px' }}>Comms Agent</span>
                    <p style={{ color: 'var(--text-secondary)' }}>Synthesizes executive incident summaries, updates Slack/Discord webhooks, and drafts publication-grade postmortems with cluster timestamps.</p>
                  </div>
                )}
              </div>
            </div>
          </section>

          {/* ==================== SECTION: LIVE INCIDENT STUDIO ==================== */}
          <section className="section" id="studio">
            <div style={{ maxWidth: '720px', marginBottom: '24px' }}>
              <h2 style={{ fontSize: '28px', fontWeight: 500, color: '#fff', letterSpacing: '-0.02em', marginBottom: '8px' }}>
                Live Incident Response Studio
              </h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '15px' }}>
                Interactive execution player demonstrating real-time multi-agent reasoning, runbook guidance, and SLO recovery.
              </p>
            </div>

            <div className="studio-grid">
              
              {/* Left Column: Controls & Visual Telemetry */}
              <div>
                <div style={{ marginBottom: '20px' }}>
                  <label style={{ fontSize: '12px', color: 'var(--text-secondary)', display: 'block', marginBottom: '8px' }}>Select Failure Scenario</label>
                  <select className="input-select" value={selectedScenario} onChange={e => setSelectedScenario(e.target.value)}>
                    <option value="single_fault/sf-001">sf-001: cartservice pod-kill (PodChaos)</option>
                    <option value="single_fault/sf-002">sf-002: paymentservice CPU hog (StressChaos)</option>
                    <option value="single_fault/sf-003">sf-003: checkoutservice OOM memory leak</option>
                    <option value="single_fault/sf-004">sf-004: frontend 50% packet loss</option>
                    <option value="single_fault/sf-005">sf-005: Redis network partition</option>
                    <option value="cascade/cs-001">cs-001: currency latency cascade to checkout</option>
                    <option value="named_replays/hist-cloudflare-2019">hist-cloudflare-2019: Regex CPU Exhaustion</option>
                    <option value="named_replays/hist-aws-s3-2017">hist-aws-s3-2017: Accidental Scale-to-Zero</option>
                  </select>
                </div>

                <div style={{ display: 'flex', gap: '12px', marginBottom: '32px' }}>
                  <button className="btn btn-primary" onClick={runSimulation} disabled={isPlaying}>
                    {isPlaying ? 'Running Autonomous Playback...' : '▶ Run Autonomous Resolution'}
                  </button>
                  <button className="btn btn-ghost" onClick={() => { setLogs([]); setPlaybackStep(0); }}>
                    Reset
                  </button>
                </div>

                {/* Telemetry Visualizer Chart */}
                <div style={{ padding: '24px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '12px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px', fontSize: '13px' }}>
                    <span style={{ color: '#fff', fontWeight: 500 }}>Cluster Error Rate SLO</span>
                    <span style={{ color: '#10b981', fontFamily: 'var(--font-mono)' }}>{telemetry.errorRate}</span>
                  </div>
                  
                  {/* Clean SVG Telemetry Sparkline */}
                  <svg viewBox="0 0 300 80" style={{ width: '100%', height: '80px' }}>
                    <path d="M 0 70 L 60 70 L 100 15 L 140 18 L 180 65 L 240 72 L 300 74" fill="none" stroke="#ef4444" strokeWidth="2"/>
                    <path d="M 0 70 L 60 70 L 100 15 L 140 18 L 180 65 L 240 72 L 300 74 L 300 80 L 0 80 Z" fill="rgba(239,68,68,0.08)"/>
                    <line x1="0" y1="65" x2="300" y2="65" stroke="#10b981" strokeWidth="1" strokeDasharray="3 3"/>
                  </svg>
                  
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--text-tertiary)', marginTop: '8px' }}>
                    <span>Incident Trigger (T=0s)</span>
                    <span>SLO Target (&lt; 1.0%)</span>
                    <span>Resolved (T=18s)</span>
                  </div>
                </div>
              </div>

              {/* Right Column: Live Stream */}
              <div>
                <div className="stream-terminal">
                  {logs.map(log => (
                    <div key={log.id} className="stream-row">
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px', fontSize: '11px' }}>
                        <span className={`badge ${log.roleClass}`}>{log.role}</span>
                        <span style={{ color: 'var(--text-tertiary)' }}>{log.time}</span>
                      </div>
                      <div style={{ color: 'var(--text-primary)' }}>
                        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: '#38bdf8', marginRight: '6px' }}>[{log.tool}]</span>
                        {log.text}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </section>

          {/* ==================== SECTION: RUNBOOK RECOMMENDER ==================== */}
          <section className="section" id="recommender">
            <div style={{ maxWidth: '720px', marginBottom: '32px' }}>
              <h2 style={{ fontSize: '28px', fontWeight: 500, color: '#fff', letterSpacing: '-0.02em', marginBottom: '8px' }}>
                Tri-Signal Hybrid Recommender (RS)
              </h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '15px' }}>
                Combines lexical BM25 token similarity, collaborative graph transition affinity, and tier priors to recommend optimal remediation runbooks with 100% Hit@3.
              </p>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '360px 1fr', gap: '32px' }}>
              
              {/* Form Controls */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                <div>
                  <label style={{ fontSize: '12px', color: 'var(--text-secondary)', display: 'block', marginBottom: '6px' }}>Firing Alert</label>
                  <select className="input-select" value={rsAlert} onChange={e => setRsAlert(e.target.value)}>
                    <option value="KubeMemoryOvercommit">KubeMemoryOvercommit</option>
                    <option value="PodCrashLooping">PodCrashLooping</option>
                    <option value="HighHTTP5xxRate">HighHTTP5xxRate</option>
                    <option value="DatabaseConnectionExhaustion">DatabaseConnectionExhaustion</option>
                    <option value="NetworkPartitionDetected">NetworkPartitionDetected</option>
                  </select>
                </div>

                <div>
                  <label style={{ fontSize: '12px', color: 'var(--text-secondary)', display: 'block', marginBottom: '6px' }}>Affected Microservice</label>
                  <select className="input-select" value={rsService} onChange={e => setRsService(e.target.value)}>
                    <option value="frontend">frontend</option>
                    <option value="checkoutservice">checkoutservice</option>
                    <option value="paymentservice">paymentservice</option>
                    <option value="cartservice">cartservice</option>
                    <option value="emailservice">emailservice</option>
                  </select>
                </div>

                <div>
                  <label style={{ fontSize: '12px', color: 'var(--text-secondary)', display: 'block', marginBottom: '6px' }}>Observed Symptoms</label>
                  <textarea className="input-text" rows="3" value={rsSymptoms} onChange={e => setRsSymptoms(e.target.value)}/>
                </div>

                <button className="btn btn-primary" onClick={handleRecommenderQuery}>
                  Compute Recommendations
                </button>
              </div>

              {/* Recommendations Output */}
              <div>
                {rsResults.map((rb, idx) => (
                  <div key={rb.id} style={{ padding: '20px', background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: '12px', marginBottom: '16px' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                      <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, color: '#fff' }}>#{idx+1} &mdash; [{rb.id}]</span>
                      <span className="badge badge-green">{(rb.score * 100).toFixed(1)}% Match Confidence</span>
                    </div>
                    <div style={{ fontSize: '14px', fontWeight: 500, color: '#fff', marginBottom: '8px' }}>{rb.title}</div>
                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)', marginBottom: '8px' }}>
                      <strong>Suggested Tools:</strong> {rb.tools.map(t => <span key={t} className="badge badge-blue" style={{ marginRight: '6px' }}>{t}</span>)}
                    </div>
                    <div style={{ fontSize: '12px', color: 'var(--text-secondary)' }}>
                      <strong>Action Sequence:</strong>
                      <ol style={{ marginLeft: '20px', marginTop: '4px' }}>
                        {rb.actions.map(a => <li key={a}>{a}</li>)}
                      </ol>
                    </div>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* ==================== SECTION: ABLATIONS ==================== */}
          <section className="section" id="ablations">
            <div style={{ maxWidth: '720px', marginBottom: '32px' }}>
              <h2 style={{ fontSize: '28px', fontWeight: 500, color: '#fff', letterSpacing: '-0.02em', marginBottom: '8px' }}>
                Multi-Model Ablation Matrix
              </h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '15px' }}>
                Empirical evaluation across 5 model architectures on held-out test splits and adversarial chaos scenarios.
              </p>
            </div>

            <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
              <button className={`btn ${ablationSplit === 'test' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setAblationSplit('test')}>Held-Out Test (T_test)</button>
              <button className={`btn ${ablationSplit === 'val' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setAblationSplit('val')}>Validation (T_val)</button>
              <button className={`btn ${ablationSplit === 'leaderboard' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setAblationSplit('leaderboard')}>Leaderboard (T_lb)</button>
              <button className={`btn ${ablationSplit === 'adversarial' ? 'btn-primary' : 'btn-ghost'}`} onClick={() => setAblationSplit('adversarial')}>Adversarial Chaos (T_adv)</button>
            </div>

            <table className="flat-table">
              <thead>
                <tr>
                  <th>Model Architecture</th>
                  <th>Resolution Rate</th>
                  <th>Avg TTR</th>
                  <th>Contract Reward</th>
                  <th>Format Compliance</th>
                  <th>Runbook Hit@3</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>Zero-Shot Baseline</strong> (Stage 6)</td>
                  <td style={{ color: 'var(--red)' }}>0.0%</td>
                  <td>45.0s</td>
                  <td>0.345</td>
                  <td>0.0%</td>
                  <td>33.3%</td>
                </tr>
                <tr>
                  <td><strong>Supervised Fine-Tuned (SFT)</strong> (Stage 8)</td>
                  <td>100.0%</td>
                  <td>32.0s</td>
                  <td>0.834</td>
                  <td>100.0%</td>
                  <td>50.0%</td>
                </tr>
                <tr>
                  <td><strong>SFT + Recommender (+RS)</strong> (Stage 11/12)</td>
                  <td>100.0%</td>
                  <td>26.5s</td>
                  <td>0.852</td>
                  <td>100.0%</td>
                  <td style={{ color: 'var(--green)' }}>100.0%</td>
                </tr>
                <tr>
                  <td><strong>Online GRPO RL</strong> (Stage 9)</td>
                  <td>100.0%</td>
                  <td>22.0s</td>
                  <td>0.868</td>
                  <td>100.0%</td>
                  <td>66.7%</td>
                </tr>
                <tr style={{ background: 'var(--surface)', fontWeight: 600 }}>
                  <td style={{ color: '#fff' }}>Full Pipeline (GAI + RS + RL)</td>
                  <td style={{ color: 'var(--green)' }}>100.0%</td>
                  <td>18.0s (-60%)</td>
                  <td>0.918</td>
                  <td>100.0%</td>
                  <td style={{ color: 'var(--green)' }}>100.0%</td>
                </tr>
              </tbody>
            </table>
          </section>

          {/* ==================== SECTION: HISTORICAL CASE STUDIES ==================== */}
          <section className="section" id="cases">
            <div style={{ maxWidth: '720px', marginBottom: '32px' }}>
              <h2 style={{ fontSize: '28px', fontWeight: 500, color: '#fff', letterSpacing: '-0.02em', marginBottom: '8px' }}>
                Historical Outage Case Studies
              </h2>
              <p style={{ color: 'var(--text-secondary)', fontSize: '15px' }}>
                10 named production outage replicas validated against ground-truth recovery playbooks.
              </p>
            </div>

            <div className="case-card">
              <div>
                <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff', marginBottom: '4px' }}>Cloudflare 2019 &mdash; Regex CPU Storm</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>Unanchored regular expression in WAF rule spiked CPU to 100% globally, dropping 82% of global traffic.</p>
                <div style={{ fontSize: '11px', color: 'var(--text-tertiary)', marginTop: '4px' }}>Playbook: RB-CPU-THROTTLE &rarr; rollback WAF rule &rarr; scale edge proxy</div>
              </div>
              <button className="btn btn-ghost" style={{ padding: '6px 14px', fontSize: '12px' }} onClick={() => { setSelectedScenario('named_replays/hist-cloudflare-2019'); setActiveSection('studio'); runSimulation(); }}>
                Simulate Playback
              </button>
            </div>

            <div className="case-card">
              <div>
                <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff', marginBottom: '4px' }}>AWS S3 2017 &mdash; Accidental Scale-to-Zero</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>An SRE typo command intending to take down billing servers took down the core S3 subsystem in us-east-1.</p>
                <div style={{ fontSize: '11px', color: 'var(--text-tertiary)', marginTop: '4px' }}>Playbook: RB-HPA-SCALE &rarr; restore index replica capacity &rarr; verify bucket health</div>
              </div>
              <button className="btn btn-ghost" style={{ padding: '6px 14px', fontSize: '12px' }} onClick={() => { setSelectedScenario('named_replays/hist-aws-s3-2017'); setActiveSection('studio'); runSimulation(); }}>
                Simulate Playback
              </button>
            </div>

            <div className="case-card">
              <div>
                <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff', marginBottom: '4px' }}>GitHub 2018 &mdash; DB Failover Loop</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>A 43-second optical loss triggered automated MySQL primary failovers with desynced replicas.</p>
                <div style={{ fontSize: '11px', color: 'var(--text-tertiary)', marginTop: '4px' }}>Playbook: RB-NET-PARTITION &rarr; isolate stale replicas &rarr; resync master</div>
              </div>
              <button className="btn btn-ghost" style={{ padding: '6px 14px', fontSize: '12px' }} onClick={() => { setSelectedScenario('named_replays/hist-github-2018'); setActiveSection('studio'); runSimulation(); }}>
                Simulate Playback
              </button>
            </div>

            <div className="case-card">
              <div>
                <h3 style={{ fontSize: '16px', fontWeight: 600, color: '#fff', marginBottom: '4px' }}>Datadog 2023 &mdash; DNS Failure Cascade</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '13px' }}>OS upgrade triggered node conntrack exhaustion, dropping DNS UDP queries across thousands of nodes.</p>
                <div style={{ fontSize: '11px', color: 'var(--text-tertiary)', marginTop: '4px' }}>Playbook: RB-DNS-RESOLV &rarr; flush node conntrack &rarr; scale CoreDNS</div>
              </div>
              <button className="btn btn-ghost" style={{ padding: '6px 14px', fontSize: '12px' }} onClick={() => { setSelectedScenario('named_replays/hist-datadog-2023'); setActiveSection('studio'); runSimulation(); }}>
                Simulate Playback
              </button>
            </div>
          </section>

        </main>

        <footer style={{ borderTop: '1px solid var(--border)', padding: '40px 0', marginTop: '80px', color: 'var(--text-tertiary)', fontSize: '12px' }}>
          <div className="layout-container" style={{ display: 'flex', justifyContent: 'space-between' }}>
            <div>AtlasOps &mdash; University continuation of Harikishanth/AtlasOps (MIT License).</div>
            <div>Master Pipeline 15 / 15 Stages Certified PASS (801 Tests Passing).</div>
          </div>
        </footer>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
