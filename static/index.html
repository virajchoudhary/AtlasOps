<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f4">
  <title>AtlasOps | Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/console.css">
  <script defer src="/static/vendor/lucide.min.js"></script>
  <script defer src="/static/live-incident.js"></script>
  <script defer src="/static/console.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span class="brand-name">AtlasOps<small>OPERATIONS</small></span></div>
      <nav class="nav" aria-label="Primary navigation">
        <span class="nav-section-label">WORKSPACE</span>
        <a href="#/overview" data-page="overview"><i data-lucide="layout-dashboard"></i>Overview</a>
        <a href="#/incidents" data-page="incidents"><i data-lucide="siren"></i>Incidents</a>
        <a href="#/agents" data-page="agents"><i data-lucide="workflow"></i>Agents</a>
        <a href="#/models" data-page="models"><i data-lucide="blocks"></i>Models</a>
        <span class="nav-section-label secondary">KNOWLEDGE</span>
        <a href="#/evaluations" data-page="evaluations"><i data-lucide="flask-conical"></i>Evaluations</a>
        <a href="#/runbooks" data-page="runbooks"><i data-lucide="book-open"></i>Runbooks</a>
        <a href="#/evidence" data-page="evidence"><i data-lucide="file-check-2"></i>Evidence</a>
      </nav>
      <div class="sidebar-bottom">
        <a class="sidebar-settings" href="#/settings" data-page="settings"><i data-lucide="settings-2"></i>Settings</a>
        <div class="environment-box">
          <span class="nav-section-label">ENVIRONMENT</span>
          <div class="rail-detail"><span class="rail-dot"></span><span id="rail-state">Runtime unverified</span></div>
          <div class="rail-detail dim" id="rail-source">Source revision unavailable</div>
          <div class="rail-detail dim">Read-only console</div>
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button mobile-menu" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false" title="Toggle navigation"><i data-lucide="menu"></i></button>
          <div class="breadcrumb"><span>AtlasOps</span><i data-lucide="chevron-right"></i><strong id="top-title">Overview</strong></div>
        </div>
        <div class="topbar-end">
          <button class="quick-open" id="quick-open" aria-label="Search workspace" title="Search workspace">
            <i data-lucide="search"></i><span>Search workspace</span>
          </button>
          <span class="top-status" id="global-status"><span class="state-dot neutral"></span>Checking runtime</span>
          <span class="top-updated" id="last-updated">Not refreshed</span>
          <button class="icon-button" id="refresh" aria-label="Refresh observations" title="Refresh observations"><i data-lucide="refresh-cw"></i></button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading-skeleton" aria-label="Loading workspace"><span></span><span></span><span></span></div>
      </main>
    </div>
  </div>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <div class="palette-backdrop" id="palette-backdrop" hidden></div>
  <section class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search workspace" hidden>
    <div class="palette-search"><i data-lucide="search" aria-hidden="true"></i>
      <input id="palette-input" type="search" autocomplete="off" placeholder="Search workspace"
        aria-label="Search workspace" aria-controls="palette-results" aria-autocomplete="list">
    </div>
    <div class="palette-results" id="palette-results" role="listbox" aria-label="Search results"></div>
  </section>
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Evidence details" aria-modal="true" role="dialog" hidden>
    <div class="drawer-top"><span class="eyebrow">EVIDENCE DETAIL</span><button class="icon-button" id="drawer-close" aria-label="Close details" title="Close details"><i data-lucide="x"></i></button></div>
    <div id="drawer-content"></div>
  </aside>
</body>
</html>
